name: Daily DB Backup

# v1.0 工程表 1.5: 日次SQLダンプ（バックアップ4層構造の第2層）
#
# 前提: GitHub Secrets に以下を登録すること（かずき手動）
#   - SUPABASE_DB_URL : Supabase の Connection string（Session/Direct）
#       Supabase Dashboard > Project Settings > Database > Connection string > URI
#       （POSTGRES_URL_NON_POOLING 相当・パスワード含む）
#
# 保存先: GitHub Actions Artifacts（30日保持）
# 第3層（Cloudflare R2）は工程表 1.6 で別途設定

on:
  schedule:
    - cron: '0 0 * * *'   # 毎日 UTC 0:00（JST 9:00）
  workflow_dispatch: {}    # 手動実行も可能

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL client (v16)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"
            exit 1
          fi
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          FILENAME="asta_backup_${TIMESTAMP}.sql.gz"
          echo "Dumping to ${FILENAME}..."
          pg_dump "$SUPABASE_DB_URL" \
            --no-owner --no-privileges --clean --if-exists \
            | gzip > "${FILENAME}"
          echo "BACKUP_FILE=${FILENAME}" >> "$GITHUB_ENV"
          ls -lh "${FILENAME}"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Report result
        if: always()
        run: echo "Backup job finished with status ${{ job.status }}"
